name: CI

on:
  push:
    branches:
    - master
    - pai-**
  pull_request:
    branches:
    - master
    - pai-**

jobs:
  deployment:
    name: Test deployment on python-${{ matrix.python }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: [2.7]
        os: [ubuntu-18.04, ubuntu-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Python ${{ matrix.python }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}
        architecture: x64
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dnspython==1.13.0 paramiko pyyaml jinja2 python-etcd kubernetes
    - name: Test with unittest
      run: |
        python -m unittest deployment.clusterObjectModel.test.test_cluster_object_model
        python -m unittest deployment.clusterObjectModel.test.test_template_generate
        python -m unittest deployment.clusterObjectModel.test.test_forward_compatibility
        cd deployment
        python -m unittest discover test

  exporters:
    name: Test exporters on python-${{ matrix.python }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: [3.7]
        os: [ubuntu-18.04, ubuntu-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Python ${{ matrix.python }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}
        architecture: x64
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install paramiko pyyaml requests prometheus_client twisted
    - name: Test job exporter
      run: |
        cd src/job-exporter/test
        python -m unittest discover .

  watchdog:
    name: Test watchdog on go-${{ matrix.go }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go: [1.13.8]
        os: [ubuntu-18.04, ubuntu-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Go ${{ matrix.go }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}
        architecture: x64
    - name: Build watchdog
      run: |
        cd src/watchdog/src
        go build ./cmd/watchdog/main.go
    - name: Test watchdog
      run: |
        cd src/watchdog/src
        go test -cover ./pkg/watchdog

  rest-server:
    name: Test rest server on Node 10
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use existing REST runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 10.24.1
    - name: Install task-local Yarn and SDK copy helper
      run: |
        npm install --prefix "$RUNNER_TEMP/rest-tools" --no-audit --no-fund yarn@1.22.22 ncp@2.0.0
        echo "$RUNNER_TEMP/rest-tools/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Strict lifecycle install and tests
      working-directory: src/rest-server
      run: |
        test "$(yarn --version)" = "1.22.22"
        sha256sum yarn.lock > "$RUNNER_TEMP/rest-lock.sha256"
        yarn install --no-default-rc --frozen-lockfile --non-interactive --production=false
        sha256sum -c "$RUNNER_TEMP/rest-lock.sha256"
        test -f node_modules/openpaidbsdk/index.js
        test ! -d openpaidbsdk
        yarn test

  code-coverage:
    name: Run code coverage of rest-server on Node 10
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use existing REST runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 10.24.1
    - name: Install task-local Yarn and SDK copy helper
      run: |
        npm install --prefix "$RUNNER_TEMP/rest-tools" --no-audit --no-fund yarn@1.22.22 ncp@2.0.0
        echo "$RUNNER_TEMP/rest-tools/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Strict lifecycle install, tests and coverage
      working-directory: src/rest-server
      run: |
        test "$(yarn --version)" = "1.22.22"
        sha256sum yarn.lock > "$RUNNER_TEMP/rest-lock.sha256"
        yarn install --no-default-rc --frozen-lockfile --non-interactive --production=false
        sha256sum -c "$RUNNER_TEMP/rest-lock.sha256"
        test -f node_modules/openpaidbsdk/index.js
        test ! -d openpaidbsdk
        yarn test
        mkdir -p coverage
        yarn run coveralls

    - name: Coveralls GitHub Action
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ./src/rest-server/coverage/lcov.info

  webportal:
    name: Test webportal on Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use portal Node version
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: src/webportal/.nvmrc
    - name: Install task-local Yarn
      run: |
        npm install --prefix "$RUNNER_TEMP/portal-yarn" --no-audit --no-fund yarn@1.22.22
        echo "$RUNNER_TEMP/portal-yarn/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Strict install, lint and production build
      working-directory: src/webportal
      run: |
        test "$(yarn --version)" = "1.22.22"
        yarn install --frozen-lockfile --non-interactive --production=false
        yarn test
        yarn build

  webportal-plugins:
    name: Test webportal plugins on node-${{ matrix.node }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [10]
        os: [ubuntu-18.04, ubuntu-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node ${{ matrix.node }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node }}
    - name: Test contrib/submit-job-v2
      run: |
        cd contrib/submit-job-v2
        yarn install --frozen-lockfiles
        yarn build

