name: CI

on:
  push:
    branches:
    - master
    - pai-**
  pull_request:
    branches:
    - master
    - pai-**

jobs:
  deployment:
    name: Test deployment on python-${{ matrix.python }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: [2.7]
        os: [ubuntu-18.04, ubuntu-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
    - name: Use Python ${{ matrix.python }}
      uses: actions/setup-python@0f07f7f756721ebd886c2462646a35f78a8bc4de # v1.2.4
      with:
        python-version: ${{ matrix.python }}
        architecture: x64
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dnspython==1.13.0 paramiko pyyaml jinja2 python-etcd kubernetes
    - name: Test with unittest
      run: |
        python -m unittest deployment.clusterObjectModel.test.test_cluster_object_model
        python -m unittest deployment.clusterObjectModel.test.test_template_generate
        python -m unittest deployment.clusterObjectModel.test.test_forward_compatibility
        cd deployment
        python -m unittest discover test

  exporters:
    name: Test exporters on python-${{ matrix.python }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: [3.7]
        os: [ubuntu-18.04, ubuntu-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
    - name: Use Python ${{ matrix.python }}
      uses: actions/setup-python@0f07f7f756721ebd886c2462646a35f78a8bc4de # v1.2.4
      with:
        python-version: ${{ matrix.python }}
        architecture: x64
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install paramiko pyyaml requests prometheus_client twisted
    - name: Test job exporter
      run: |
        cd src/job-exporter/test
        python -m unittest discover .

  watchdog:
    name: Test watchdog on go-${{ matrix.go }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go: [1.13.8]
        os: [ubuntu-18.04, ubuntu-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Use Go ${{ matrix.go }}
      uses: actions/setup-go@0caeaed6fd66a828038c2da3c0f662a42862658f # v1.1.3
      with:
        go-version: ${{ matrix.go }}
        architecture: x64
    - name: Build watchdog
      run: |
        cd src/watchdog/src
        go build ./cmd/watchdog/main.go
    - name: Test watchdog
      run: |
        cd src/watchdog/src
        go test -cover ./pkg/watchdog

  rest-server:
    name: Test rest server on node-${{ matrix.node }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [10]
        os: [ubuntu-18.04, ubuntu-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
    - name: Use Node ${{ matrix.node }}
      uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
      with:
        node-version: ${{ matrix.node }}
    - name: yarn install and test
      run: |
        cd src/rest-server
        yarn install --frozen-lockfiles
        yarn test

  code-coverage:
    name: Run code coverage of rest-server on node-${{ matrix.node }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [10]
        os: [ubuntu-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Use Node ${{ matrix.node }}
      uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
      with:
        node-version: ${{ matrix.node }}
    - name: yarn install and test
      run: |
        cd src/rest-server
        yarn install --frozen-lockfiles
        yarn test
        mkdir ./coverage
        yarn run coveralls

    - name: Coveralls GitHub Action
      uses: coverallsapp/github-action@348853a262cc37fa2f8abe2827729d193cbb00dc # v1.1.1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # Path to lcov file
        path-to-lcov: ./src/rest-server/coverage/lcov.info

  webportal:
    name: Test webportal on Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Use portal Node version
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: src/webportal/.nvmrc
    - name: Install task-local Yarn
      run: |
        npm install --prefix "$RUNNER_TEMP/portal-yarn" --no-audit --no-fund yarn@1.22.22
        echo "$RUNNER_TEMP/portal-yarn/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Strict install, lint and production build
      working-directory: src/webportal
      run: |
        test "$(yarn --version)" = "1.22.22"
        yarn install --frozen-lockfile --non-interactive --production=false
        yarn test
        yarn build

  webportal-plugins:
    name: Test webportal plugins on node-${{ matrix.node }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [10]
        os: [ubuntu-18.04, ubuntu-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
    - name: Use Node ${{ matrix.node }}
      uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
      with:
        node-version: ${{ matrix.node }}
    - name: Test contrib/submit-job-v2
      run: |
        cd contrib/submit-job-v2
        yarn install --frozen-lockfiles
        yarn build

